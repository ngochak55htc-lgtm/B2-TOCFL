ộc, ép", "pos": "V", "collocation": "迫使離開", "example": "租金上漲迫使部分家庭搬離市區。", "translation": "Giá thuê tăng buộc một số gia đình rời trung tâm.", "near": "強迫", "id": "t01-w36"}, {"zh": "呼籲", "pinyin": "hūyù", "vi": "kêu gọi", "pos": "V/N", "collocation": "呼籲重視", "example": "團體呼籲社會重視長照問題。", "translation": "Tổ chức kêu gọi xã hội coi trọng vấn đề chăm sóc dài hạn.", "near": "號召", "id": "t01-w37"}, {"zh": "妥善", "pinyin": "tuǒshàn", "vi": "thỏa đáng, chu đáo", "pos": "T/P", "collocation": "妥善處理", "example": "主管機關應妥善處理居民的申訴。", "translation": "Cơ quan có thẩm quyền cần xử lý thỏa đáng khiếu nại của cư dân.", "near": "適當", "id": "t01-w38"}, {"zh": "成效", "pinyin": "chéngxiào", "vi": "hiệu quả, kết quả", "pos": "N", "collocation": "評估成效", "example": "政府應定期評估補助政策的成效。", "translation": "Chính phủ nên định kỳ đánh giá hiệu quả chính sách trợ cấp.", "near": "效果", "id": "t01-w39"}, {"zh": "共識", "pinyin": "gòngshí", "vi": "đồng thuận", "pos": "N", "collocation": "達成共識", "example": "各方經過討論後終於達成共識。", "translation": "Các bên cuối cùng đạt đồng thuận sau thảo luận.", "near": "一致意見", "id": "t01-w40"}], "passages": [{"id": "t01-p1", "mode": "R", "title": "居住正義與城市發展", "body": "近年來，某市推動都市更新，希望改善老舊住宅與公共設施。然而，部分居民質疑開發計畫是否真正考量弱勢族群的需求。儘管建商宣稱計畫能創造就業機會，租金上漲卻可能迫使低收入家庭搬離原來的社區。為了保障居民的基本權益，市府決定公開相關資訊，設立申訴管道，並提供租金補助。民間團體指出，若缺乏長期監督，即使短期措施能減輕負擔，也未必能解決貧困與城鄉資源分配不均的問題。因此，城市發展的成效不應只以經濟收益衡量，也應評估居民的生活品質。", "vi": "Những năm gần đây, một thành phố thúc đẩy tái thiết đô thị để cải thiện nhà cũ và cơ sở công cộng. Tuy nhiên, một số cư dân nghi ngờ dự án có thực sự quan tâm nhu cầu nhóm yếu thế hay không. Dù chủ đầu tư tuyên bố dự án tạo việc làm, giá thuê tăng có thể buộc gia đình thu nhập thấp rời khu dân cư cũ. Để bảo đảm quyền lợi cơ bản của cư dân, chính quyền công khai thông tin, lập kênh khiếu nại và trợ cấp thuê nhà. Các tổ chức dân sự cho rằng nếu thiếu giám sát lâu dài, biện pháp ngắn hạn dù giảm gánh nặng cũng chưa chắc giải quyết nghèo đói và phân bổ nguồn lực không đều. Vì vậy hiệu quả phát triển đô thị không chỉ nên đo bằng lợi ích kinh tế mà còn phải đánh giá chất lượng sống.", "questions": [{"id": "t01-p1-q1", "prompt": "作者主要想說明什麼？", "options": ["都市更新應兼顧居民權益與生活品質。", "都市更新只需要增加建商利潤。", "所有居民都反對都市更新。", "租金補助能永久消除貧困。"], "answer": 0, "explanation": "Câu cuối nhấn mạnh phải đánh giá cả chất lượng sống, không chỉ lợi ích kinh tế.", "words": ["t01-w2", "t01-w11", "t01-w39"]}, {"id": "t01-p1-q2", "prompt": "居民為什麼提出質疑？", "options": ["擔心低收入家庭因開發而被迫搬離。", "希望市府停止公開資訊。", "認為租金應該繼續上漲。", "不希望增加公共設施。"], "answer": 0, "explanation": "Giá thuê tăng có thể buộc gia đình thu nhập thấp rời đi.", "words": ["t01-w3", "t01-w4", "t01-w36"]}, {"id": "t01-p1-q3", "prompt": "文中「即使……也未必……」的意思是什麼？", "options": ["就算有短期措施，也不保證能解決問題。", "只要有短期措施，問題一定解決。", "沒有措施才可以減輕負擔。", "短期措施完全沒有作用。"], "answer": 0, "explanation": "Cấu trúc nhượng bộ: dù có biện pháp ngắn hạn cũng chưa chắc giải quyết được vấn đề.", "words": ["t01-w24", "t01-w29"]}]}, {"id": "t01-p2", "mode": "R", "title": "消除職場歧視", "body": "一家企業發現，年長求職者即使具備足夠的專業能力，仍常因年齡偏見而被排斥。管理團隊決定調整招募流程，要求面試官根據工作能力而非年齡評估求職者，並建立公平的升遷制度。部分主管擔心新制度會增加行政負擔，但人資部門指出，多元與包容不僅能減少歧視，也能讓員工更願意分享經驗。企業還提供申訴管道，以避免勞工遭受不合理待遇或剝削。經過一年的試行，員工對制度的信任逐漸提高。這項經驗顯示，保障權益並非單靠口號，而需要透明的流程與持續監督。", "vi": "Một doanh nghiệp nhận thấy ứng viên lớn tuổi dù đủ năng lực vẫn thường bị loại vì định kiến tuổi tác. Ban quản lý điều chỉnh tuyển dụng, yêu cầu đánh giá theo năng lực thay vì tuổi, lập chế độ thăng tiến công bằng. Một số quản lý lo tăng gánh nặng hành chính, nhưng nhân sự cho rằng đa dạng và bao dung giảm phân biệt và khuyến khích chia sẻ kinh nghiệm. Doanh nghiệp cũng lập kênh khiếu nại tránh đãi ngộ bất hợp lý hay bóc lột. Sau một năm thử nghiệm, niềm tin tăng dần. Bảo đảm quyền lợi cần quy trình minh bạch và giám sát liên tục, không chỉ khẩu hiệu.", "questions": [{"id": "t01-p2-q1", "prompt": "企業調整招募流程的主要原因是什麼？", "options": ["年齡偏見影響了求職者的機會。", "年長員工完全沒有工作能力。", "公司希望取消所有面試。", "員工拒絕分享工作經驗。"], "answer": 0, "explanation": "Đoạn đầu nêu vấn đề định kiến tuổi tác.", "words": ["t01-w5", "t01-w16", "t01-w21"]}, {"id": "t01-p2-q2", "prompt": "人資部門對新制度有何看法？", "options": ["包容能減少歧視並促進經驗分享。", "新制度必然降低員工能力。", "應取消所有申訴管道。", "只需宣傳，不需改變流程。"], "answer": 0, "explanation": "Nhân sự nhấn mạnh lợi ích của bao dung và đa dạng.", "words": ["t01-w5", "t01-w17"]}]}, {"id": "t01-p3", "mode": "L", "title": "社區志工訪談", "body": "主持人：最近社區中心招募志工，是為了什麼？負責人：我們發現有些長者不熟悉網路，申請社會福利時經常陷入困境。因此，我們安排志工協助他們使用線上服務。主持人：資源有限，您如何分配？負責人：我們優先服務需求最迫切的居民，也呼籲市府增加補助。主持人：如何確認計畫的成效？負責人：我們每月收集意見，妥善處理申訴，希望各方能達成共識。", "vi": "Người dẫn: Vì sao trung tâm tuyển tình nguyện viên? Phụ trách: Một số người cao tuổi không quen Internet, gặp khó khi xin phúc lợi. Chúng tôi bố trí tình nguyện viên hỗ trợ dịch vụ trực tuyến. Người dẫn: Nguồn lực hạn chế, phân bổ thế nào? Phụ trách: Ưu tiên cư dân có nhu cầu cấp thiết nhất và kêu gọi chính quyền tăng trợ cấp. Người dẫn: Đánh giá hiệu quả thế nào? Phụ trách: Thu thập ý kiến mỗi tháng, xử lý khiếu nại thỏa đáng và mong các bên đạt đồng thuận.", "questions": [{"id": "t01-p3-q1", "prompt": "志工主要提供什麼服務？", "options": ["協助長者使用線上服務。", "替居民購買房屋。", "向居民收取高額費用。", "取消社區的福利服務。"], "answer": 0, "explanation": "Người phụ trách nói rõ việc hỗ trợ người cao tuổi dùng dịch vụ trực tuyến.", "words": ["t01-w13", "t01-w23", "t01-w31"]}, {"id": "t01-p3-q2", "prompt": "中心優先服務哪一類居民？", "options": ["需求最迫切的人。", "收入最高的人。", "最熟悉網路的人。", "住在國外的人。"], "answer": 0, "explanation": "Cụm 需求最迫切 chỉ nhóm có nhu cầu cấp thiết nhất.", "words": ["t01-w26", "t01-w27"]}]}, {"id": "t01-p4", "mode": "L", "title": "就業服務說明會", "body": "各位好，今天的說明會主要介紹失業者的就業協助措施。符合資格的民眾可以申請職業訓練補助，減輕短期的生活負擔。不過，補助並不能取代穩定的工作收入，因此我們也與企業合作，提供面試機會。如果您在求職過程中遭遇歧視，可以向服務中心申訴。我們會妥善處理相關案件，並定期評估政策成效。", "vi": "Xin chào, buổi giới thiệu hôm nay nói về biện pháp hỗ trợ việc làm cho người thất nghiệp. Người đủ điều kiện có thể xin trợ cấp đào tạo nghề để giảm gánh nặng ngắn hạn. Tuy nhiên, trợ cấp không thay thế thu nhập ổn định, nên chúng tôi hợp tác với doanh nghiệp cung cấp cơ hội phỏng vấn. Nếu gặp phân biệt đối xử khi tìm việc, có thể khiếu nại với trung tâm. Chúng tôi xử lý thỏa đáng và định kỳ đánh giá hiệu quả chính sách.", "questions": [{"id": "t01-p4-q1", "prompt": "這場說明會的主要目的為何？", "options": ["介紹失業者可獲得的就業協助。", "推銷房屋貸款。", "要求企業減少招募。", "說明如何取消社會福利。"], "answer": 0, "explanation": "Câu mở đầu giới thiệu mục tiêu hỗ trợ việc làm.", "words": ["t01-w23", "t01-w24", "t01-w35"]}, {"id": "t01-p4-q2", "prompt": "為什麼中心還與企業合作？", "options": ["補助不能取代穩定的工作收入。", "所有求職者都不需要訓練。", "中心希望取消申訴管道。", "企業不願意提供面試。"], "answer": 0, "explanation": "Người nói nêu trực tiếp trợ cấp không thể thay thế thu nhập ổn định.", "words": ["t01-w14", "t01-w29"]}]}], "questions": []}, {"id": "t02", "zh": "經濟與金融", "vi": "Kinh tế và tài chính", "full": true, "words": [{"zh": "通貨膨脹", "pinyin": "tōnghuò péngzhàng", "vi": "lạm phát", "pos": "N", "collocation": "抑制通貨膨脹", "example": "央行採取措施抑制通貨膨脹。", "translation": "Ngân hàng trung ương áp dụng biện pháp kiềm chế lạm phát.", "near": "物價上漲", "id": "t02-w1"}, {"zh": "利率", "pinyin": "lìlǜ", "vi": "lãi suất", "pos": "N", "collocation": "調升利率", "example": "銀行調升利率後，借款成本增加。", "translation": "Sau khi ngân hàng tăng lãi suất, chi phí vay tăng.", "near": "利息率", "id": "t02-w2"}, {"zh": "匯率", "pinyin": "huìlǜ", "vi": "tỷ giá", "pos": "N", "collocation": "匯率波動", "example": "匯率波動會影響進口成本。", "translation": "Biến động tỷ giá ảnh hưởng chi phí nhập khẩu.", "near": "兌換率", "id": "t02-w3"}, {"zh": "預算", "pinyin": "yùsuàn", "vi": "ngân sách", "pos": "N/V", "collocation": "編列預算", "example": "財務部門正在編列明年的預算。", "translation": "Bộ phận tài chính đang lập ngân sách năm tới.", "near": "經費規劃", "id": "t02-w4"}, {"zh": "支出", "pinyin": "zhīchū", "vi": "chi tiêu, khoản chi", "pos": "V/N", "collocation": "控制支出", "example": "家庭可以透過記帳控制支出。", "translation": "Gia đình có thể kiểm soát chi tiêu bằng ghi chép.", "near": "開銷", "id": "t02-w5"}, {"zh": "收入", "pinyin": "shōurù", "vi": "thu nhập, khoản thu", "pos": "N", "collocation": "穩定收入", "example": "穩定收入有助於規劃長期儲蓄。", "translation": "Thu nhập ổn định giúp lập kế hoạch tiết kiệm dài hạn.", "near": "所 3"}, {"zh": "策略", "pinyin": "cèlüè", "vi": "chiến lược", "pos": "N", "collocation": "經營策略", "example": "管理團隊正在調整經營策略。", "translation": "Nhóm quản lý đang điều chỉnh chiến lược kinh doanh.", "near": "方針", "id": "t02-w34"}, {"zh": "效益", "pinyin": "xiàoyì", "vi": "hiệu ích, lợi ích đạt được", "pos": "N", "collocation": "成本效益", "example": "決策者應比較不同方案的成本效益。", "translation": "Người ra quyết định nên so sánh chi phí và lợi ích các phương án.", "near": "成效", "id": "t02-w35"}, {"zh": "控管", "pinyin": "kòngguǎn", "vi": "kiểm soát, quản lý", "pos": "V/N", "collocation": "風險控管", "example": "銀行建立嚴格的風險控管制度。", "translation": "Ngân hàng xây dựng hệ thống kiểm soát rủi ro nghiêm ngặt.", "near": "控制", "id": "t02-w36"}, {"zh": "缺口", "pinyin": "quēkǒu", "vi": "khoảng thiếu hụt", "pos": "N", "collocation": "資金缺口", "example": "公司需要籌措資金以填補資金缺口。", "translation": "Công ty cần huy động vốn để bù thiếu hụt nguồn tiền.", "near": "不足", "id": "t02-w37"}, {"zh": "周轉", "pinyin": "zhōuzhuǎn", "vi": "xoay vòng vốn", "pos": "V/N", "collocation": "資金周轉", "example": "延遲收款可能造成資金周轉困難。", "translation": "Thu tiền chậm có thể gây khó khăn xoay vòng vốn.", "near": "調度資金", "id": "t02-w38"}, {"zh": "營收", "pinyin": "yíngshōu", "vi": "doanh thu", "pos": "N", "collocation": "營收成長", "example": "公司今年的營收成長，但成本也增加。", "translation": "Doanh thu công ty năm nay tăng nhưng chi phí cũng tăng.", "near": "營業收入", "id": "t02-w39"}, {"zh": "撥款", "pinyin": "bōkuǎn", "vi": "giải ngân, cấp khoản tiền", "pos": "V/N", "collocation": "政府撥款", "example": "政府撥款支持產業轉型。", "translation": "Chính phủ cấp vốn hỗ trợ chuyển đổi ngành.", "near": "款項分配", "id": "t02-w40"}], "passages": [{"id": "t02-p1", "mode": "R", "title": "企業的現金流管理", "body": "某家製造公司今年營收成長，財務報表也顯示公司仍有利潤。然而，客戶延遲付款，加上原料成本上升，使公司的現金流逐漸緊張。財務部門發現，即使帳面上沒有虧損，公司仍可能因資金周轉不順而無法按時償還貸款。管理團隊因此重新編列預算，控制非必要支出，並與銀行討論短期融資方案。主管強調，融資雖能暫時填補資金缺口，但也可能增加負債及利率風險。公司最終決定改善收款流程，並根據市場需求調整生產計畫，以維持長期的財務穩定。", "vi": "Một công ty sản xuất tăng doanh thu và báo cáo vẫn có lãi. Tuy nhiên khách hàng chậm trả, chi phí nguyên liệu tăng khiến dòng tiền căng thẳng. Tài chính nhận thấy dù không lỗ trên sổ sách, công ty vẫn có thể không trả nợ đúng hạn vì vòng quay vốn không thuận lợi. Ban quản lý lập lại ngân sách, kiểm soát chi không cần thiết và bàn tài trợ ngắn hạn với ngân hàng. Huy động vốn tuy bù thiếu hụt tạm thời nhưng có thể tăng nợ và rủi ro lãi suất. Công ty quyết định cải thiện thu tiền và điều chỉnh sản xuất theo nhu cầu để ổn định lâu dài.", "questions": [{"id": "t02-p1-q1", "prompt": "這家公司的主要問題是什麼？", "options": ["現金流緊張，資金周轉困難。", "完全沒有營收。", "原料成本持續下降。", "所有客戶都提前付款。"], "answer": 0, "explanation": "Doanh thu và lợi nhuận vẫn có nhưng thiếu dòng tiền.", "words": ["t02-w13", "t02-w15", "t02-w38"]}, {"id": "t02-p1-q2", "prompt": "為何主管不主張只依賴融資？", "options": ["融資可能增加負債與利率風險。", "融資一定會降低負債。", "融資可以永久解決收款問題。", "銀行不允許企業編列預算。"], "answer": 0, "explanation": "Đoạn nêu huy động vốn chỉ giải quyết tạm thời, có rủi ro nợ và lãi suất.", "words": ["t02-w2", "t02-w8", "t02-w11", "t02-w14"]}, {"id": "t02-p1-q3", "prompt": "公司最後採取什麼做法？", "options": ["改善收款流程並依需求調整生產。", "停止所有財務管理。", "提高所有非必要支出。", "忽略客戶付款狀況。"], "answer": 0, "explanation": "Câu cuối nêu hai biện pháp cụ thể.", "words": ["t02-w17", "t02-w26"]}]}, {"id": "t02-p2", "mode": "R", "title": "物價與家庭理財", "body": "當通貨膨脹持續升高時，民眾往往發現即使收入沒有減少，購買力也可能下降。為了抑制物價上漲，央行可能調升利率，但這也會增加家庭的貸款負擔。理財專家建議，與其盲目追求高收益，不如先建立緊急預備金，並透過記帳了解每月的支出結構。對於有長期投資需求的人而言，分散投資能降低單一資產價格波動的影響，但不能完全避免虧損。因此，家庭應根據實際收入、負債與風險承受能力規劃儲蓄，而不是單純模仿他人的投資策略。", "vi": "Khi lạm phát tăng, dù thu nhập không giảm sức mua vẫn có thể giảm. Để kiềm giá, ngân hàng trung ương có thể tăng lãi suất, cũng tăng gánh nặng vay. Chuyên gia khuyên thay vì mù quáng chạy theo lợi tức cao, hãy lập quỹ dự phòng và ghi chép chi tiêu. Đa dạng đầu tư giảm tác động biến động của một tài sản nhưng không tránh hoàn toàn thua lỗ. Gia đình cần lập tiết kiệm theo thu nhập, nợ và khả năng chịu rủi ro thay vì bắt chước chiến lược người khác.", "questions": [{"id": "t02-p2-q1", "prompt": "專家建議家庭優先做什麼？", "options": ["建立緊急預備金並了解支出結構。", "把所有收入投入單一資產。", "停止所有儲蓄。", "借更多錢追求高收益。"], "answer": 0, "explanation": "Chuyên gia khuyên lập quỹ dự phòng trước.", "words": ["t02-w5", "t02-w9", "t02-w23"]}, {"id": "t02-p2-q2", "prompt": "分散投資的作用是什麼？", "options": ["降低集中風險，但不能保證不虧損。", "保證每筆投資都有利潤。", "完全消除物價上漲。", "讓貸款利率自動下降。"], "answer": 0, "explanation": "Bài nói giảm rủi ro chứ không bảo đảm tránh lỗ.", "words": ["t02-w7", "t02-w8", "t02-w10", "t02-w22"]}]}, {"id": "t02-p3", "mode": "L", "title": "財務部門會議", "body": "主管：我們這一季的營收比去年高，但利潤反而下降。會計：主要原因是匯率波動和原料成本增加。我們已完成成本核算，建議重新審核採購預算。主管：那現金流呢？會計：目前最大的風險是部分客戶延遲付款。我們需要加強收款控管，而不是立刻增加貸款。主管：好，請先提出改善策略，再評估是否需要融資。", "vi": "Quản lý: Doanh thu quý này cao hơn năm trước nhưng lợi nhuận giảm. Kế toán: Chủ yếu do tỷ giá biến động và chi phí nguyên liệu tăng. Đã hạch toán chi phí, đề nghị xét lại ngân sách mua hàng. Quản lý: Dòng tiền thì sao? Kế toán: Rủi ro lớn nhất là khách trả chậm. Cần kiểm soát thu tiền thay vì tăng vay ngay. Quản lý: Hãy đưa chiến lược cải thiện trước rồi đánh giá cần huy động vốn không.", "questions": [{"id": "t02-p3-q1", "prompt": "利潤下降的主要原因是什麼？", "options": ["匯率波動與原料成本增加。", "營收完全消失。", "公司停止核算成本。", "客戶都提前付款。"], "answer": 0, "explanation": "Kế toán nêu hai nguyên nhân trực tiếp.", "words": ["t02-w3", "t02-w15", "t02-w16"]}, {"id": "t02-p3-q2", "prompt": "會計建議先做什麼？", "options": ["加強收款控管。", "立即增加所有貸款。", "停止審核預算。", "取消財務報表。"], "answer": 0, "explanation": "Ưu tiên kiểm soát thu tiền thay vì vay thêm ngay.", "words": ["t02-w13", "t02-w24", "t02-w36"]}]}, {"id": "t02-p4", "mode": "L", "title": "市場景氣分析", "body": "根據本次調查，市場需求已有回升的跡象，但不同產業的復甦速度並不一致。出口企業受匯率波動影響較大，而內需產業則更關注民眾的購買力。部分企業計畫增加投資，提升競爭力；另一些企業仍選擇控制支出，以因應可能出現的景氣衰退。分析師提醒，評估經營策略時，不應只看短期收益，也必須注意長期成本與風險。", "vi": "Theo khảo sát, nhu cầu thị trường có dấu hiệu tăng nhưng tốc độ phục hồi không đều. Doanh nghiệp xuất khẩu chịu tác động tỷ giá lớn, ngành nội nhu quan tâm sức mua. Một số dự định tăng đầu tư để nâng cạnh tranh, số khác kiểm soát chi để ứng phó suy thoái có thể xảy ra. Chuyên gia nhắc đánh giá chiến lược không chỉ nhìn lợi tức ngắn hạn mà cả chi phí, rủi ro dài hạn.", "questions": [{"id": "t02-p4-q1", "prompt": "不同產業的復甦情況如何？", "options": ["復甦速度並不一致。", "所有產業都已完全復甦。", "所有企業都停止投資。", "內需產業不關心購買力。"], "answer": 0, "explanation": "Bản tin nêu tốc độ phục hồi khác nhau.", "words": ["t02-w17", "t02-w19", "t02-w21"]}, {"id": "t02-p4-q2", "prompt": "分析師提醒企業注意什麼？", "options": ["長期成本與風險。", "只看短期收益。", "完全忽略市場需求。", "不必評估經營策略。"], "answer": 0, "explanation": "Câu cuối nhấn mạnh chi phí và rủi ro dài hạn.", "words": ["t02-w8", "t02-w9", "t02-w34"]}]}], "questions": []}, {"id": "t03", "zh": "環境保護", "vi": "Bảo vệ môi trường", "full": true, "words": [{"zh": "污染", "pinyin": "wūrǎn", "vi": "ô nhiễm", "pos": "V/N", "collocation": "空氣污染", "example": "工廠必須減少空氣污染。", "translation": "Nhà máy phải giảm ô nhiễm không khí.", "near": "汙染", "id": "t03-w1"}, {"zh": "排放", "pinyin": "páifàng", "vi": "phát thải, xả", "pos": "V/N", "collocation": "碳排放", "example": "企業應定期公布碳排放數據。", "translation": "Doanh nghiệp nên định kỳ công bố dữ liệu phát thải carbon.", "near": "排出", "id": "t03-w2"}, {"zh": "減碳", "pinyin": "jiǎntàn", "vi": "giảm phát thải carbon", "pos": "V/N", "collocation": "減碳目標", "example": "政府訂定新的減碳目標。", "translation": "Chính phủ đặt mục tiêu giảm carbon mới.", "near": "降低碳排放", "id": "t03-w3"}, {"zh": "回收", "pinyin": "huíshōu", "vi": "thu hồi, tái chế (thu gom)", "pos": "V/N", "collocation": "資源回收", "example": "居民應做好垃圾分類與資源回收。", "translation": "Cư dân nên phân loại rác và thu hồi tài nguyên.", "near": "回收利用", "id": "t03-w4"}, {"zh": "再生能源", "pinyin": "zàishēng néngyuán", "vi": "năng lượng tái tạo", "pos": "N", "collocation": "發展再生能源", "example": "發展再生能源有助於減少化石燃料的使用。", "translation": "Phát triển năng lượng tái tạo giúp giảm dùng nhiên liệu hóa thạch.", "near": "綠能", "id": "t03-w5"}, {"zh": "永續", "pinyin": "yǒngxù", "vi": "bền vững", "pos": "T/V", "collocation": "永續發展", "example": "企業開始重視永續發展。", "translation": "Doanh nghiệp bắt đầu chú trọng phát triển bền vững.", "near": "可持續", "id": "t03-w6"}, {"zh": "生態", "pinyin": "shēngtài", "vi": "sinh thái", "pos": "N", "collocation": "生態系統", "example": "開發計畫可能破壞當地生態系統。", "translation": "Dự án phát triển có thể phá hoại hệ sinh thái địa phương.", "near": "自然環境", "id": "t03-w7"}, {"zh": "棲地", "pinyin": "qīdì", "vi": "môi trường sống của sinh vật", "pos": "N", "collocation": "保護棲地", "example": "保護棲地有助於維護生物多樣性。", "translation": "Bảo vệ sinh cảnh giúp duy trì đa dạng sinh học.", "near": "棲息地", "id": "t03-w8"}, {"zh": "廢棄物", "pinyin": "fèiqìwù", "vi": "chất thải", "pos": "N", "collocation": "處理廢棄物", "example": "工廠應依法處理工業廢棄物。", "translation": "Nhà máy cần xử lý chất thải công nghiệp theo luật.", "near": "垃圾", "id": "t03-w9"}, {"zh": "消耗", "pinyin": "xiāohào", "vi": "tiêu hao", "pos": "V/N", "collocation": "能源消耗", "example": "改善設備可以減少能源消耗。", "translation": "Cải thiện thiết bị có thể giảm tiêu hao năng lượng.", "near": "耗費", "id": "t03-w10"}, {"zh": "耗損", "pinyin": "hàosǔn", "vi": "hao hụt, tổn hao", "pos": "V/N", "collocation": "資源耗損", "example": "過度開採會加速自然資源耗損。", "translation": "Khai thác quá mức làm tăng hao hụt tài nguyên.", "near": "損耗", "id": "t03-w11"}, {"zh": "氣候變遷", "pinyin": "qìhòu biànqiān", "vi": "biến đổi khí hậu", "pos": "N", "collocation": "因應氣候變遷", "example": "沿海城市需要因應氣候變遷的計畫。", "translation": "Thành phố ven biển cần kế hoạch ứng phó biến đổi khí hậu.", "near": "氣候變化", "id": "t03-w12"}, {"zh": "溫室氣體", "pinyin": "wēnshì qìtǐ", "vi": "khí nhà kính", "pos": "N", "collocation": "溫室氣體排放", "example": "運輸業是溫室氣體排放的來源之一。", "translation": "Ngành vận tải là một nguồn phát thải khí nhà kính.", "near": "GHG", "id": "t03-w13"}, {"zh": "節能", "pinyin": "jiénéng", "vi": "tiết kiệm năng lượng", "pos": "V/N", "collocation": "節能設備", "example": "使用節能設備能降低電費。", "translation": "Dùng thiết bị tiết kiệm năng lượng có thể giảm tiền điện.", "near": "省能源", "id": "t03-w14"}, {"zh": "轉型", "pinyin": "zhuǎnxíng", "vi": "chuyển đổi mô hình", "pos": "V/N", "collocation": "能源轉型", "example": "能源轉型需要政府與民間共同參與。", "translation": "Chuyển đổi năng lượng cần chính phủ và tư nhân cùng tham gia.", "near": "轉變", "id": "t03-w15"}, {"zh": "倡導", "pinyin": "chàngdǎo", "vi": "đề xướng, cổ vũ", "pos": "V", "collocation": "倡導環保", "example": "學校透過活動倡導環保觀念。", "translation": "Trường học cổ vũ ý thức môi trường qua hoạt động.", "near": "提倡", "id": "t03-w16"}, {"zh": "濫用", "pinyin": "lànyòng", "vi": "lạm dụng", "pos": "V", "collocation": "濫用資源", "example": "我們不應濫用有限的水資源。", "translation": "Chúng ta không nên lạm dụng tài nguyên nước hữu hạn.", "near": "過度使用", "id": "t03-w17"}, {"zh": "開採", "pinyin": "kāicǎi", "vi": "khai thác", "pos": "V", "collocation": "開採礦產", "example": "過度開採礦產可能造成地表破壞。", "translation": "Khai thác khoáng sản quá mức có thể phá hoại bề mặt đất.", "near": "採掘", "id": "t03-w18"}, {"zh": "復育", "pinyin": "fùyù", "vi": "phục hồi sinh thái", "pos": "V/N", "collocation": "生態復育", "example": "志工協助進行海岸生態復育。", "translation": "Tình nguyện viên hỗ trợ phục hồi sinh thái bờ biển.", "near": "恢復生態", "id": "t03-w19"}, {"zh": "物種", "pinyin": "wùzhǒng", "vi": "loài sinh vật", "pos": "N", "collocation": "瀕危物種", "example": "政府建立保護區以保護瀕危物種。", "translation": "Chính phủ lập khu bảo tồn để bảo vệ loài nguy cấp.", "near": "生物種類", "id": "t03-w20"}, {"zh": "多樣性", "pinyin": "duōyàngxìng", "vi": "tính đa dạng", "pos": "N", "collocation": "生物多樣性", "example": "森林對維護生物多樣性十分重要。", "translation": "Rừng rất quan trọng đối với duy trì đa dạng sinh học.", "near": "多元性", "id": "t03-w21"}, {"zh": "乾旱", "pinyin": "gānhàn", "vi": "hạn hán", "pos": "N/T", "collocation": "嚴重乾旱", "example": "嚴重乾旱導致農作物減產。", "translation": "Hạn hán nghiêm trọng khiến sản lượng nông sản giảm.", "near": "缺水", "id": "t03-w22"}, {"zh": "洪水", "pinyin": "hóngshuǐ", "vi": "lũ lụt", "pos": "N", "collocation": "預防洪水", "example": "城市應改善排水系統以預防洪水。", "translation": "Thành phố nên cải thiện hệ thống thoát nước để phòng lũ.", "near": "水災", "id": "t03-w23"}, {"zh": "極端", "pinyin": "jíduān", "vi": "cực đoan, cực độ", "pos": "T", "collocation": "極端天氣", "example": "極端天氣對農業造成重大影響。", "translation": "Thời tiết cực đoan gây ảnh hưởng lớn đến nông nghiệp.", "near": "非常態", "id": "t03-w24"}, {"zh": "因應", "pinyin": "yīnyìng", "vi": "ứng phó", "pos": "V", "collocation": "因應變化", "example": "企業必須因應能源價格的變化。", "translation": "Doanh nghiệp phải ứng phó biến động giá năng lượng.", "near": "應對", "id": "t03-w25"}, {"zh": "減緩", "pinyin": "jiǎnhuǎn", "vi": "làm chậm, giảm nhẹ", "pos": "V", "collocation": "減緩衝擊", "example": "植樹有助於減緩高溫的衝擊。", "translation": "Trồng cây giúp giảm nhẹ tác động của nhiệt độ cao.", "near": "緩和", "id": "t03-w26"}, {"zh": "替代", "pinyin": "tìdài", "vi": "thay thế", "pos": "V", "collocation": "替代方案", "example": "研究團隊正在尋找塑膠的替代方案。", "translation": "Nhóm nghiên cứu đang tìm phương án thay thế nhựa.", "near": "取代", "id": "t03-w27"}, {"zh": "循環", "pinyin": "xúnhuán", "vi": "tuần hoàn", "pos": "V/N", "collocation": "循環經濟", "example": "循環經濟強調延長產品使用壽命。", "translation": "Kinh tế tuần hoàn nhấn mạnh kéo dài tuổi thọ sản phẩm.", "near": "迴圈", "id": "t03-w28"}, {"zh": "效率", "pinyin": "xiàolǜ", "vi": "hiệu suất", "pos": "N", "collocation": "能源效率", "example": "新型冷氣的能源效率較高。", "translation": "Điều hòa thế hệ mới có hiệu suất năng lượng cao hơn.", "near": "效能", "id": "t03-w29"}, {"zh": "稽查", "pinyin": "jīchá", "vi": "thanh tra, kiểm tra", "pos": "V/N", "collocation": "環保稽查", "example": "主管機關定期進行環保稽查。", "translation": "Cơ quan có thẩm quyền định kỳ thanh tra môi trường.", "near": "查核", "id": "t03-w30"}, {"zh": "法規", "pinyin": "fǎguī", "vi": "quy định pháp luật", "pos": "N", "collocation": "遵守法規", "example": "廠商應遵守廢水排放法規。", "translation": "Nhà sản xuất cần tuân thủ quy định xả nước thải.", "near": "規章", "id": "t03-w31"}, {"zh": "違規", "pinyin": "wéiguī", "vi": "vi phạm quy định", "pos": "V/N", "collocation": "違規排放", "example": "違規排放的工廠可能受到處罰。", "translation": "Nhà máy xả thải trái quy định có thể bị xử phạt.", "near": "違反規定", "id": "t03-w32"}, {"zh": "污水", "pinyin": "wūshuǐ", "vi": "nước ô nhiễm", "pos": "N", "collocation": "污水處理", "example": "社區增設污水處理設備。", "translation": "Cộng đồng lắp thêm thiết bị xử lý nước ô nhiễm.", "near": "汙水", "id": "t03-w33"}, {"zh": "監測", "pinyin": "jiāncè", "vi": "quan trắc, theo dõi đo đạc", "pos": "V/N", "collocation": "水質監測", "example": "研究人員定期進行水質監測。", "translation": "Nhà nghiên cứu định kỳ quan trắc chất lượng nước.", "near": "偵測", "id": "t03-w34"}, {"zh": "指標", "pinyin": "zhǐbiāo", "vi": "chỉ số, chỉ tiêu", "pos": "N", "collocation": "環境指標", "example": "空氣品質是重要的環境指標。", "translation": "Chất lượng không khí là chỉ số môi trường quan trọng.", "near": "衡量標準", "id": "t03-w35"}, {"zh": "評估", "pinyin": "pínggū", "vi": "đánh giá", "pos": "V/N", "collocation": "環境影響評估", "example": "大型工程開始前應進行環境影響評估。", "translation": "Trước khi bắt đầu công trình lớn cần đánh giá tác động môi trường.", "near": "衡量", "id": "t03-w36"}, {"zh": "維護", "pinyin": "wéihù", "vi": "duy trì, bảo vệ", "pos": "V", "collocation": "維護環境", "example": "居民共同維護社區環境。", "translation": "Cư dân cùng bảo vệ môi trường cộng đồng.", "near": "維持", "id": "t03-w37"}, {"zh": "推動", "pinyin": "tuīdòng", "vi": "thúc đẩy, triển khai", "pos": "V", "collocation": "推動政策", "example": "市府積極推動低碳交通政策。", "translation": "Chính quyền thành phố tích cực triển khai chính sách giao thông carbon thấp.", "near": "促進", "id": "t03-w38"}, {"zh": "落實", "pinyin": "luòshí", "vi": "thực thi, thực hiện thực chất", "pos": "V", "collocation": "落實政策", "example": "企業應落實垃圾減量政策。", "translation": "Doanh nghiệp nên thực thi chính sách giảm rác.", "near": "實行", "id": "t03-w39"}, {"zh": "衝擊", "pinyin": "chōngjí", "vi": "tác động mạnh, cú sốc", "pos": "V/N", "collocation": "環境衝擊", "example": "開發案可能對沿海生態造成衝擊。", "translation": "Dự án phát triển có thể tác động mạnh tới sinh thái ven biển.", "near": "影響", "id": "t03-w40"}], "passages": [{"id": "t03-p1", "mode": "R", "title": "從回收走向循環經濟", "body": "過去，許多人認為只要做好資源回收，就能解決廢棄物造成的污染。然而，回收過程本身也會消耗能源，而且部分材料並不容易再次利用。近年來，有些企業開始採用循環經濟的概念，從產品設計階段就考量維修、替代材料與使用壽命，藉此降低自然資源的耗損。政府也透過法規與政策推動產業轉型，要求企業公布相關環境指標。專家指出，若只強調回收率而忽略源頭減量，可能無法達成減碳目標。因此，永續發展需要企業、政府與消費者共同落實，才能真正減緩生產活動對生態造成的衝擊。", "vi": "Trước đây nhiều người nghĩ chỉ cần tái chế là giải quyết ô nhiễm chất thải. Tuy nhiên quá trình thu hồi cũng tốn năng lượng, một số vật liệu khó tái sử dụng. Gần đây doanh nghiệp áp dụng kinh tế tuần hoàn, tính đến sửa chữa, vật liệu thay thế và tuổi thọ ngay khi thiết kế để giảm hao hụt tài nguyên. Chính phủ thúc đẩy chuyển đổi bằng quy định, yêu cầu công bố chỉ số môi trường. Nếu chỉ nhấn tỷ lệ tái chế mà bỏ giảm rác từ nguồn có thể không đạt mục tiêu carbon. Phát triển bền vững cần doanh nghiệp, nhà nước và người dùng cùng thực hiện.", "questions": [{"id": "t03-p1-q1", "prompt": "作者對資源回收的看法是什麼？", "options": ["回收重要，但仍需要從源頭減量。", "回收完全沒有價值。", "回收不會消耗任何能源。", "只要回收就一定能達成減碳目標。"], "answer": 0, "explanation": "Bài nhấn mạnh tái chế cần đi cùng giảm rác từ nguồn.", "words": ["t03-w3", "t03-w4", "t03-w10"]}, {"id": "t03-p1-q2", "prompt": "循環經濟強調什麼？", "options": ["在設計階段考量維修與使用壽命。", "鼓勵快速丟棄所有產品。", "禁止使用任何替代材料。", "只要求增加生產量。"], "answer": 0, "explanation": "Đoạn giữa nêu thiết kế, sửa chữa và tuổi thọ.", "words": ["t03-w11", "t03-w27", "t03-w28"]}, {"id": "t03-p1-q3", "prompt": "達成永續發展需要哪些人參與？", "options": ["企業、政府及消費者共同參與。", "只有政府。", "只有環保專家。", "只有產品設計師。"], "answer": 0, "explanation": "Câu cuối nêu ba nhóm cùng thực thi.", "words": ["t03-w6", "t03-w39"]}]}, {"id": "t03-p2", "mode": "R", "title": "濕地與氣候調適", "body": "沿海地區近年受到極端天氣影響，洪水發生的頻率逐漸增加。某市原本打算開發一片濕地以興建住宅，環境影響評估卻顯示，這片濕地不僅是多種鳥類的棲地，也具有儲存雨水、減緩洪水衝擊的功能。地方團體因此倡導保護濕地，避免過度開發造成生態破壞。經過討論，市府決定調整計畫，推動生態復育及長期水質監測。研究人員表示，維護生物多樣性與因應氣候變遷並非互相衝突的目標，適當的規劃反而能同時改善兩方面的問題。", "vi": "Vùng ven biển chịu thời tiết cực đoan, lũ tăng dần. Thành phố định xây nhà trên đất ngập nước nhưng đánh giá môi trường cho thấy đây là sinh cảnh của nhiều loài chim, cũng trữ nước mưa và giảm tác động lũ. Nhóm địa phương vận động bảo vệ vùng đất ngập nước. Sau thảo luận, chính quyền điều chỉnh dự án, phục hồi sinh thái và quan trắc nước dài hạn. Nhà nghiên cứu cho rằng bảo vệ đa dạng sinh học và ứng phó khí hậu không mâu thuẫn; quy hoạch phù hợp cải thiện cả hai.", "questions": [{"id": "t03-p2-q1", "prompt": "市府為何調整開發計畫？", "options": ["濕地具有生態及減緩洪水的功能。", "濕地完全沒有任何生物。", "住宅需求已經永遠消失。", "水質監測會增加洪水。"], "answer": 0, "explanation": "Đánh giá chỉ ra vai trò sinh cảnh và giảm lũ của vùng đất ngập nước.", "words": ["t03-w8", "t03-w23", "t03-w26", "t03-w36"]}, {"id": "t03-p2-q2", "prompt": "研究人員認為哪個說法正確？", "options": ["生態保護與氣候調適可以同時進行。", "保護物種一定會妨礙氣候調適。", "所有沿海濕地都應開發。", "生態復育不需要任何規劃。"], "answer": 0, "explanation": "Câu cuối nêu hai mục tiêu có thể hỗ trợ nhau.", "words": ["t03-w19", "t03-w21", "t03-w25"]}]}, {"id": "t03-p3", "mode": "L", "title": "工廠環保稽查", "body": "記者：這次環保稽查發現了什麼問題？稽查人員：我們發現部分工廠違規排放污水，可能對河川生態造成衝擊。記者：接下來會採取什麼措施？稽查人員：除了依法處理，我們會加強水質監測，要求業者改善污水處理設備。記者：這些措施如何評估成效？稽查人員：我們將定期公布環境指標，確認污染是否減少。", "vi": "Phóng viên: Đợt thanh tra phát hiện gì? Thanh tra: Một số nhà máy xả nước ô nhiễm trái quy định, có thể tác động hệ sinh thái sông. Phóng viên: Biện pháp tiếp theo? Thanh tra: Ngoài xử lý theo luật, tăng quan trắc nước và yêu cầu cải thiện thiết bị xử lý. Phóng viên: Đánh giá hiệu quả thế nào? Thanh tra: Công bố định kỳ chỉ số môi trường để xác nhận ô nhiễm giảm không.", "questions": [{"id": "t03-p3-q1", "prompt": "稽查發現的主要問題為何？", "options": ["部分工廠違規排放污水。", "工廠完全沒有用水。", "河川水質已經完全改善。", "所有企業都停止生產。"], "answer": 0, "explanation": "Thanh tra nói rõ việc xả nước ô nhiễm trái quy định.", "words": ["t03-w2", "t03-w30", "t03-w32", "t03-w33"]}, {"id": "t03-p3-q2", "prompt": "稽查人員如何確認措施的成效？", "options": ["定期公布環境指標並確認污染變化。", "不再進行任何水質監測。", "只詢問工廠的營收。", "取消所有環保法規。"], "answer": 0, "explanation": "Câu cuối nói về công bố chỉ số và theo dõi ô nhiễm.", "words": ["t03-w1", "t03-w34", "t03-w35"]}]}, {"id": "t03-p4", "mode": "L", "title": "能源轉型座談", "body": "主持人：推動再生能源是否代表只要興建更多發電設備就好？專家：並不是。能源轉型還需要提高能源效率，減少不必要的消耗，並評估新設備對生態的影響。主持人：如果企業想達成減碳目標，應從何開始？專家：可以先了解自己的溫室氣體排放情況，採用節能設備，再逐步尋找化石燃料的替代方案。這樣才能讓永續政策真正落實。", "vi": "Người dẫn: Thúc đẩy năng lượng tái tạo chỉ cần xây thêm thiết bị phát điện? Chuyên gia: Không. Chuyển đổi còn cần tăng hiệu suất, giảm tiêu hao không cần thiết, đánh giá tác động sinh thái. Người dẫn: Doanh nghiệp nên bắt đầu thế nào để giảm carbon? Chuyên gia: Hiểu tình trạng phát thải khí nhà kính, dùng thiết bị tiết kiệm năng lượng rồi tìm phương án thay nhiên liệu hóa thạch. Như vậy mới thực thi chính sách bền vững.", "questions": [{"id": "t03-p4-q1", "prompt": "專家認為能源轉型還需要什麼？", "options": ["提升效率並評估生態影響。", "只增加發電設備。", "完全不必減少消耗。", "取消所有環境評估。"], "answer": 0, "explanation": "Chuyên gia nêu tăng hiệu suất, giảm tiêu hao, đánh giá sinh thái.", "words": ["t03-w10", "t03-w15", "t03-w29", "t03-w36"]}, {"id": "t03-p4-q2", "prompt": "企業要減碳，可以先做什麼？", "options": ["了解自身溫室氣體排放情況。", "停止使用所有節能設備。", "增加化石燃料消耗。", "不必掌握排放數據。"], "answer": 0, "explanation": "Chuyên gia nói trước tiên hiểu tình trạng phát thải của mình.", "words": ["t03-w2", "t03-w3", "t03-w13", "t03-w14"]}]}], "questions": []}, {"id": "t04", "zh": "日常生活", "vi": "Cuộc sống hằng ngày", "full": false, "words": [{"zh": "習慣", "pinyin": "xíguàn", "vi": "thói quen", "pos": "N/V", "collocation": "養成習慣", "example": "她養成每天閱讀的習慣。", "translation": "Cô ấy hình thành thói quen đọc mỗi ngày.", "near": "慣例", "id": "t04-w1"}, {"zh": "安排", "pinyin": "ānpái", "vi": "sắp xếp", "pos": "V/N", "collocation": "安排時間", "example": "我會先安排明天的行程。", "translation": "Tôi sẽ sắp xếp lịch trình ngày mai trước.", "near": "規劃", "id": "t04-w2"}, {"zh": "便利", "pinyin": "biànlì", "vi": "tiện lợi", "pos": "T", "collocation": "生活便利", "example": "住在車站附近相當便利。", "translation": "Sống gần ga khá tiện lợi.", "near": "方便", "id": "t04-w3"}, {"zh": "維持", "pinyin": "wéichí", "vi": "duy trì", "pos": "V", "collocation": "維持作息", "example": "忙碌時仍應維持正常作息。", "translation": "Khi bận vẫn nên duy trì nếp sinh hoạt bình thường.", "near": "保持", "id": "t04-w4"}], "passages": [], "questions": []}, {"id": "t05", "zh": "人際關係", "vi": "Quan hệ giữa người với người", "full": false, "words": [{"zh": "溝通", "pinyin": "gōutōng", "vi": "giao tiếp", "pos": "V/N", "collocation": "有效溝通", " function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;toast('Không lưu được trên trình duyệt. Hãy xuất bản sao lưu.');}}
function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',4000)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function rebuild(){T=JSON.parse(JSON.stringify(BASE));for(const w of S.custom.words||[]){let t=T.find(t=>t.id===w.topic);if(t)t.words.push(w)}for(const q of S.custom.questions||[]){let t=T.find(t=>t.id===q.topic);if(t)t.questions.push(q)}wordIndex=new Map(T.flatMap(t=>t.words.map(w=>[w.id,w])));for(const t of T){if(!t.passages.length){const w=t.words.slice(0,4);if(w.length){for(const mode of ['R','L']){const p={id:t.id+'-mini'+mode,mode,title:'短句練習 · Luyện câu ngắn',body:w.map(x=>x.example).join('\n'),vi:w.map(x=>x.translation).join('\n'),mini:true,questions:[]};p.questions=w.map((x,i)=>({id:p.id+'-'+i,prompt:'「'+x.example.replace(x.zh,'______')+'」\n哪一個詞最適合？',options:[x.zh,...w.filter(y=>y.id!==x.id).map(y=>y.zh)].slice(0,4),answer:0,explanation:x.zh+' — '+x.vi+'。 '+x.translation,words:[x.id]}));t.passages.push(p)}}}}}
const topic=()=>T.find(t=>t.id===tid)||T[0], allWords=()=>T.flatMap(t=>t.words), P=id=>S.progress[id]||{stage:0,due:0,seen:0,right:0,wrong:0}, dueWords=()=>allWords().filter(w=>P(w.id).seen&&P(w.id).due<=Date.now()), known=t=>t.words.filter(w=>P(w.id).stage>=4).length, seen=t=>t.words.filter(w=>P(w.id).seen).length, percent=t=>Math.round(known(t)/Math.max(1,t.words.length)*100), acc=()=>S.stats.attempts?Math.round(S.stats.correct/S.stats.attempts*100):0;
function btn(label,act,attrs='',cl=''){return `<button class="${cl}" data-act="${act}" ${attrs}>${label}</button>`}
function progress(n){return `<div class="progress" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="100"><i style="width:${n}%"></i></div>`}
function heading(a,b){return `<div class="section"><h1>${a}</h1><p class="muted">${b}</p></div>`}
function render(){document.body.classList.toggle('dark',!!S.dark);$('#date').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#nav').innerHTML=navs.map(([id,i,z,v])=>`<button data-act="nav" data-id="${id}" class="${page===id||page==='topic'&&id==='topics'?'active':''}"><span class="symbol">${i}</span><span>${v}<span class="small muted"> · ${z}</span></span></button>`).join('');let h='';if(page==='home')h=home();if(page==='topics')h=topics();if(page==='topic')h=topicView();if(page==='due')h=dueView();if(page==='wrong')h=wrongView();if(page==='report')h=report();if(page==='settings')h=settings();$('#app').innerHTML=h;updateClock()}
function topicCard(t){return `<button class="card topic" data-act="topic" data-id="${t.id}"><span class="tag ${t.full?'':'starter'}">${t.full?'CHUYÊN SÂU · B2':'KHỞI ĐỘNG · MỞ RỘNG'}</span><h3 lang="zh-Hant">${E(t.zh)}</h3><span class="muted">${E(t.vi)}</span><span class="small">${t.words.length} từ · ${seen(t)} đã học · ${known(t)} vững</span>${progress(percent(t))}<span class="go">Vào học →</span></button>`}
function home(){const total=allWords().length,learned=allWords().filter(w=>P(w.id).seen).length,master=allWords().filter(w=>P(w.id).stage>=4).length;return `<section class="hero"><div class="kicker">每天進步一點點 · TOCFL B2</div><h1>Chinh phục tiếng Trung<br>phồn thể Đài Loan</h1><p>Học theo chủ đề, ghi nhớ từ vựng, vận dụng vào đọc – nghe và luyện đề. Mỗi lần học đều được lưu lại trên thiết bị.</p>${btn('Bắt đầu học →','topic','data-id="t01"')}${btn('Ôn đến hạn ('+dueWords().length+')','nav','data-id="due"')}</section>${!storageOK?'<div class="info warn">Trình duyệt không hỗ trợ lưu trữ hiện tại. Hãy xuất bản sao lưu sau khi học.</div>':''}<div class="grid stats">${[['Từ đã học',learned+'/'+total],['Từ ghi nhớ tốt',master],['Đến hạn ôn',dueWords().length],['Độ chính xác',S.stats.attempts?acc()+'%':'—']].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div><div class="hrow between section"><h2>推薦主題 · Chủ đề chuyên sâu</h2>${btn('Tất cả 25 chủ đề →','nav','data-id="topics"','subtle')}</div><div class="grid">${T.filter(t=>t.full).map(topicCard).join('')}</div><div class="section"><h2>今日任務 · Lộ trình đề xuất</h2></div><div class="card stack"><div>01 · Ôn từ đến hạn — ${dueWords().length} từ</div><div>02 · Học 10–15 từ mới và tự kiểm tra bằng flashcard</div><div>03 · Làm bài điền từ, đọc hoặc nghe theo chủ đề</div><div>04 · Ôn câu sai và kiểm tra lại sau một ngày</div></div>`}
function topics(){return heading('主題學習 · Học theo chủ đề','25 chủ đề · 3 chủ đề chuyên sâu và 22 chủ đề khởi động có thể bổ sung học liệu.')+`<div class="row"><input class="search" id="topicsearch" placeholder="Tìm chủ đề 中文 / tiếng Việt" value="${A(search)}"><select id="topicfilter"><option value="all" ${filter==='all'?'selected':''}>Tất cả</option><option value="full" ${filter==='full'?'selected':''}>Chuyên sâu</option><option value="starter" ${filter==='starter'?'selected':''}>Khởi động</option></select></div><div class="grid section" id="topicgrid">${filteredTopics()}</div>`}
function filteredTopics(){const s=search.toLowerCase().trim();return T.filter(t=>(filter==='all'||(filter==='full')===t.full)&&(!s||(t.zh+' '+t.vi).toLowerCase().includes(s))).map(topicCard).join('')||'<div class="empty">Không tìm thấy chủ đề.</div>'}
function topicView(){const t=topic();let top=`<div class="row">${btn('← 25 chủ đề','nav','data-id="topics"','subtle')}<span class="tag ${t.full?'':'starter'}">${t.full?'CHUYÊN SÂU':'KHỞI ĐỘNG'}</span></div><div class="section"><h1 lang="zh-Hant">${E(t.zh)}</h1><p class="muted">${E(t.vi)} · ${t.words.length} từ · ${known(t)} ghi nhớ tốt</p>${progress(percent(t))}</div><div class="tabs">${tabs.map(([id,z])=>btn(z,'tab',`data-id="${id}"`,tab===id?'active':'')).join('')}</div>`;if(!t.full)top+=`<div class="info warn small">Chủ đề khởi động: 4 từ gốc, bài tập tự sinh và luyện câu ngắn. Bài đọc/nghe dài B2 chưa được biên soạn; có thể nhập thêm từ và câu hỏi trong mục Dữ liệu.</div>`;if(tab==='words')return top+wordView(t);if(tab==='flash')return top+flashView(t.words);if(tab==='practice')return top+(session?quizView():match?matchView():practiceView(t));if(tab==='read'||tab==='listen')return top+(session?quizView():passagesView(t,tab==='read'?'R':'L'));if(tab==='exam')return top+(session?quizView():examView(t));return top}
function wordCard(w){return `<article class="card word"><div><div class="han" lang="zh-Hant">${E(w.zh)}</div><span class="py">${E(w.pinyin)}</span> <span class="tag">${E(w.pos)}</span><p><b>${E(w.vi)}</b></p><p class="small muted">搭配 · ${E(w.collocation)}</p><div class="example" lang="zh-Hant">${E(w.example)}<span class="small muted" lang="vi">${E(w.translation)}</span></div><p class="small">近義詞 / Gần nghĩa: ${E(w.near||'—')} <span class="muted">(tùy ngữ cảnh)</span></p><div class="small muted">${P(w.id).seen?'Mức '+P(w.id).stage+'/5 · Ôn '+new Date(P(w.id).due).toLocaleString('vi-VN'):'Chưa học'}</div></div><div class="stack" style="align-content:start">${btn('🔊','speak',`data-word="${A(w.id)}"`,'iconbtn')}${btn('＋ Ôn','mark',`data-word="${A(w.id)}"`,'iconbtn')}</div></article>`}
function wordView(t){return `<div class="row"><input class="search" id="wordsearch" placeholder="Tìm chữ Hán, Pinyin, nghĩa..." value="${A(search)}">${btn('Học flashcard →','tab','data-id="flash"','primary')}</div><div id="wordgrid" class="grid section">${filteredWords(t)}</div>`}
function filteredWords(t){const s=search.trim().toLowerCase();return t.words.filter(w=>[w.zh,w.vi,w.pinyin,w.collocation].join(' ').toLowerCase().includes(s)).map(wordCard).join('')||'<div class="empty">Không tìm thấy từ.</div>'}
function grade(w,n){let p={...P(w.id)},step=n===0?0:n===1?1:n===2?Math.max(2,Math.min(5,p.stage+1)):Math.max(3,Math.min(5,p.stage+1));let delay=n===0?300000:n===1?3600000:[300000,3600000,DAY,3*DAY,7*DAY,14*DAY][step];p.stage=step;p.due=Date.now()+delay;p.seen=(p.seen||0)+1;S.progress[w.id]=p;save()}
function initFlash(words,mode='all',reverse=false){let pool=mode==='new'?words.filter(w=>!P(w.id).seen):mode==='due'?words.filter(w=>P(w.id).seen&&P(w.id).due<=Date.now()):mode==='weak'?words.filter(w=>P(w.id).stage<3):words;flash={ids:shuffle(pool).map(w=>w.id),i:0,flip:false,reverse,mode,done:0}}
function flashView(words){if(!flash)initFlash(words);const f=flash,w=wordIndex.get(f.ids[f.i]);let head=`<div class="row between"><div><h2>單字卡 · Flashcard</h2><p class="small muted">Tự đánh giá để đặt lịch ôn lại. Lật thẻ trước khi chấm.</p></div><div class="row"><select id="flashmode"><option value="all" ${f.mode==='all'?'selected':''}>Tất cả</option><option value="new" ${f.mode==='new'?'selected':''}>Từ mới</option><option value="due" ${f.mode==='due'?'selected':''}>Đến hạn</option><option value="weak" ${f.mode==='weak'?'selected':''}>Chưa vững</option></select><label class="small"><input type="checkbox" id="reverse" ${f.reverse?'checked':''}> Việt → Trung</label></div></div>`;if(!w)return head+`<div class="card empty"><h2>${f.done?'已完成 · Đã hoàn thành':'Không có từ phù hợp'}</h2><p>${f.done?'Đã đánh giá '+f.done+' từ. Lịch ôn đã lưu.':'Chọn nhóm từ khác hoặc quay lại khi đến hạn.'}</p>${btn('Học lại','flashreset','','primary')}</div>`;return head+`<div class="row between section"><span>${f.i+1}/${f.ids.length} · ${f.done} đã chấm</span>${btn('Xáo lại','flashreset','','subtle')}</div>${progress(Math.round(f.i/f.ids.length*100))}<div class="flash" data-act="flip" role="button" tabindex="0" aria-label="Lật thẻ"><span class="tag">${f.flip?'MẶT SAU · 背面':'MẶT TRƯỚC · 正面'}</span><div class="big" lang="zh-Hant">${E(f.reverse&&!f.flip?w.vi:w.zh)}</div>${f.flip?`<div class="py">${E(w.pinyin)}</div><h2>${E(w.vi)}</h2><p>${E(w.collocation)} · ${E(w.pos)}</p><div class="example">${E(w.example)}<span class="small muted">${E(w.translation)}</span></div><p class="small muted">近義詞: ${E(w.near)}</p>`:'<p class="muted">Nhấn để lật thẻ</p>'}</div><div class="row" style="justify-content:center;margin-top:10px">${btn('← Trước','flashprev',f.i===0?'disabled':'')}${btn('🔊 Phát âm','speak',`data-word="${A(w.id)}"`)}${btn('Lật thẻ','flip')}${btn('Sau →','flashnext')}</div><div class="controls">${['Không nhớ','Hơi nhớ','Đã nhớ','Rất chắc'].map((x,i)=>btn(x,'grade',`data-n="${i}" ${f.flip?'':'disabled'}`,i===0?'danger':i===3?'primary':'')).join('')}</div>`}
function dueView(){return heading('複習 · Ôn tập ngắt quãng',dueWords().length+' từ đã đến hạn. Ôn đúng lịch giúp ghi nhớ lâu hơn.')+flashView(dueWords())}
function qMake(t,w,kind){let pool=t.words.filter(x=>x.id!==w.id),other=shuffle(pool).slice(0,3),prompt='',correct='',opts=[],audio='';if(kind==='meaning'){prompt='「'+w.zh+'」 nghĩa là gì?';correct=w.vi;opts=other.map(x=>x.vi)}else if(kind==='reverse'){prompt='Chọn từ tiếng Trung: '+w.vi;correct=w.zh;opts=other.map(x=>x.zh)}else if(kind==='cloze'){if(!w.example.includes(w.zh))return qMake(t,w,'reverse');prompt=w.example.split(w.zh).join('______');correct=w.zh;opts=other.map(x=>x.zh)}else if(kind==='syn'){if(!w.near)return qMake(t,w,'meaning');prompt='Từ/cụm gần nghĩa nhất với「'+w.zh+'」 trong ngữ cảnh này là gì?\n'+w.example;correct=w.near;opts=other.map(x=>x.near||x.zh)}else if(kind==='audio'){prompt='Nghe phát âm và chọn từ tương ứng.';audio=w.zh;correct=w.zh;opts=other.map(x=>x.zh)}else{prompt='Điền từ tiếng Trung: '+w.vi+'\n'+w.example.split(w.zh).join('______');correct=w.zh;opts=[]}opts=[...new Set(opts.filter(x=>x!==correct))];let choices=kind==='type'?[]:[correct,...opts];return {id:w.id+'-'+kind,prompt,options:choices,answer:0,typed:kind==='type'?correct:null,audio,explanation:w.zh+' ('+w.pinyin+') — '+w.vi+'。 '+w.example+' — '+w.translation+(kind==='syn'?'。 Từ gần nghĩa chỉ thay thế được trong một số ngữ cảnh.':''),words:[w.id]}}
function prepare(q,p=null){let copy={...q};if(p){copy.passage=p;copy.audio=p.mode==='L'?p.body:''}if(copy.options?.length){const answer=copy.options[copy.answer];copy.options=shuffle(copy.options);copy.answer=copy.options.indexOf(answer)}return copy}
function startSession(qs,title,exam=false,minutes=0){if(!qs.length){toast('Chưa có câu hỏi phù hợp.');return}stopSpeech();match=null;session={qs,title,exam,i:0,answers:{},graded:{},flags:{},done:false,end:exam?Date.now()+minutes*60000:0,minutes,plays:{},review:false};render();scrollQuiz()}
function scrollQuiz(){setTimeout(()=>document.querySelector('.quiz')?.scrollIntoView({block:'start',behavior:'auto'}),0)}
const kinds=[['meaning','選詞義 · Chọn nghĩa'],['reverse','選漢字 · Chọn chữ Hán'],['cloze','填空 · Điền từ'],['syn','近義詞 · Từ gần nghĩa'],['audio','聽單字 · Nghe từ'],['type','輸入 · Gõ chữ Hán'],['match','配對 · Nối từ']];
function practiceView(t){return `<div class="card"><h2>詞彙練習 · Ôn luyện từ vựng</h2><p class="muted">Chọn dạng bài, số câu và phạm vi. Câu hỏi được tạo từ ngân hàng từ của chủ đề, không gọi API.</p><div class="row section"><label>Phạm vi <select id="scope"><option value="all">Toàn chủ đề</option><option value="seen">Từ đã học</option><option value="weak">Từ chưa vững</option><option value="due">Từ đến hạn</option></select></label><label>Số câu <select id="count"><option>10</option><option>20</option><option>40</option></select></label></div><div class="grid">${kinds.map(([k,l])=>btn(l,'practice',`data-id="${k}"`,'subtle')).join('')}${btn('綜合 · Tổng hợp','practice','data-id="mixed"','primary')}${t.questions.length?btn('Câu hỏi đã nhập ('+t.questions.length+')','custompractice','','subtle'):''}</div></div>`}
function scopeWords(t){let f=$('#scope')?.value||'all';return t.words.filter(w=>f==='seen'?P(w.id).seen:f==='weak'?P(w.id).stage<3:f==='due'?P(w.id).seen&&P(w.id).due<=Date.now():true)}
function startPractice(kind){let t=topic(),pool=shuffle(scopeWords(t)),count=Number($('#count')?.value||10);if(!pool.length)return toast('Không có từ thuộc phạm vi này. Hãy chọn toàn chủ đề.');if(kind==='match'){match={words:pool.slice(0,Math.min(8,count)),right:[],picked:null,solved:[],mistakes:0};match.right=shuffle(match.words);session=null;render();return}const ks=['meaning','reverse','cloze','syn','audio','type'];let qs=pool.slice(0,count).map((w,i)=>prepare(qMake(t,w,kind==='mixed'?ks[i%ks.length]:kind)));startSession(qs,kinds.find(x=>x[0]===kind)?.[1]||'Ôn tập tổng hợp')}
function matchView(){const m=match;return `<div class="card quiz"><div class="row between"><h2>配對 · Nối từ với nghĩa</h2>${btn('Thoát','quit')}</div><p class="muted">Chọn một từ bên trái, sau đó chọn nghĩa bên phải. ${m.solved.length}/${m.words.length} cặp · ${m.mistakes} lỗi</p><div class="matchgrid section"><div>${m.words.map(w=>btn(E(w.zh)+' <span class="small muted">'+E(w.pinyin)+'</span>','matchleft',`data-id="${A(w.id)}" ${m.solved.includes(w.id)?'disabled':''}`,m.solved.includes(w.id)?'done':m.picked===w.id?'chosen':'')).join('')}</div><div>${m.right.map(w=>btn(E(w.vi),'matchright',`data-id="${A(w.id)}" ${m.solved.includes(w.id)?'disabled':''}`,m.solved.includes(w.id)?'done':'')).join('')}</div></div>${m.solved.length===m.words.length?`<div class="feedback">Hoàn thành! Kết quả đã được lưu.</div>${btn('Làm bài mới','quit','','primary')}`:''}</div>`}
function passagesView(t,mode){let ps=t.passages.filter(p=>p.mode===mode);return `<h2>${mode==='R'?'閱讀理解 · Đọc hiểu':'聽力理解 · Nghe hiểu'}</h2><p class="muted">${mode==='R'?'Đọc bài và trả lời câu hỏi. Có thể xem bản dịch trong chế độ luyện tập.':'Nghe bằng giọng đọc trình duyệt. Transcript và bản dịch mở sau khi trả lời xong.'}</p><div class="grid section">${ps.map(p=>`<div class="card stack"><span class="tag">${p.mini?'CÂU NGẮN':'BÀI '+(mode==='R'?'ĐỌC':'NGHE')+' · B2 tham khảo'}</span><h3 lang="zh-Hant">${E(p.title)}</h3><span class="muted small">${p.questions.length} câu hỏi · ${p.body.replace(/\s/g,'').length} ký tự</span>${btn('Bắt đầu →','passage',`data-id="${A(p.id)}"`,'primary')}</div>`).join('')}</div>`}
function examView(t){return `<div class="card stack"><h2>主題模擬測驗 · Luyện đề theo chủ đề</h2><p class="muted">Đề tự biên soạn, gồm câu hỏi từ vựng, bài đọc và bài nghe. Điểm là tỷ lệ đúng, không quy đổi sang điểm TOCFL CAT.</p><div class="row"><label>Thời gian <select id="minutes"><option>10</option><option selected>20</option><option>30</option><option>45</option></select> phút</label><label>Chọn bộ đề <select id="examset"><option value="1">Đề 1 · Từ vựng + đọc</option><option value="2">Đề 2 · Từ vựng + nghe</option><option value="3" selected>Đề 3 · Tổng hợp</option></select></label></div>${btn('開始測驗 · Bắt đầu thi','examstart','','primary')}<div class="info small">Trong chế độ thi: ẩn đáp án, dịch và từ gợi ý; mỗi bài nghe tối đa 2 lượt phát. Nếu không có giọng Trung, có thể luyện đọc thay vì thi nghe.</div></div>`}
function startExam(){let t=topic(),set=Number($('#examset').value),minutes=Number($('#minutes').value),pool=shuffle(t.words),ks=['meaning','reverse','cloze','syn'];let qs=pool.slice(0,Math.min(12,pool.length)).map((w,i)=>prepare(qMake(t,w,ks[(i+set)%ks.length])));for(const p of t.passages.filter(p=>set===3||p.mode===(set===1?'R':'L')))qs.push(...p.questions.map(q=>prepare(q,p)));if(set===3)qs.push(...t.questions.slice(0,8).map(q=>prepare(q)));startSession(qs,'Đề '+set+' · '+t.vi,true,minutes)}
function isRight(q,a){return q.typed?String(a??'').trim().normalize('NFC')===q.typed.normalize('NFC'):Number.isInteger(a)&&a===q.answer}
function logAnswer(q,a){let ok=isRight(q,a);S.stats.attempts++;if(ok)S.stats.correct++;for(const id of q.words||[]){if(!wordIndex.has(id))continue;let p={...P(id)};p.seen=(p.seen||0)+1;if(ok){p.right=(p.right||0)+1;if(!p.due){p.stage=1;p.due=Date.now()+3600000}}else{p.wrong=(p.wrong||0)+1;p.stage=Math.max(0,p.stage-1);p.due=Date.now()+300000}S.progress[id]=p}if(ok){if(S.wrong[q.id]){S.wrong[q.id].streak=(S.wrong[q.id].streak||0)+1;if(S.wrong[q.id].streak>=2)delete S.wrong[q.id]}}else{let old=S.wrong[q.id];S.wrong[q.id]={q:JSON.parse(JSON.stringify(q)),count:(old?.count||0)+1,streak:0,last:Date.now(),answer:a??null}}save();return ok}
function quizView(){const s=session;if(s.done)return resultsView();const q=s.qs[s.i],a=s.answers[s.i],graded=!!s.graded[s.i],p=q.passage;let h=`<div class="card quiz"><div class="row between"><div><span class="tag">${s.exam?'考試模式 · THI THỬ':'練習模式 · LUYỆN TẬP'}</span><h2>${E(s.title)}</h2></div>${s.exam?'<span id="timer" class="timer">--:--</span>':''}${btn('Thoát','quit','','danger')}</div><div class="row between section"><span>Câu ${s.i+1}/${s.qs.length}</span><span class="small muted">Đã trả lời ${Object.keys(s.answers).length}</span></div>${progress(Math.round(Object.keys(s.answers).length/s.qs.length*100))}`;if(p){h+=`<h3 lang="zh-Hant">${E(p.title)}</h3>`;if(p.mode==='R')h+=`<div class="passage" lang="zh-Hant">${s.exam?E(p.body):highlight(p.body,topic().words.map(w=>w.id))}</div>${!s.exam?`<details><summary>Hiện bản dịch tiếng Việt</summary><p>${E(p.vi)}</p></details>`:''}`;if(p.mode==='L')h+=`<p class="muted small">Nghe đoạn văn, sau đó chọn đáp án. ${s.exam?'Tối đa 2 lượt cho cả bài nghe.':''}</p>`}if(q.audio){let played=s.plays[p?.id||q.id]||0;h+=`<div class="row section">${btn('▶ 播放 · Phát âm thanh','qaudio',s.exam&&played>=2?'disabled':'','primary')}<label>Tốc độ <select id="speed" ${s.exam?'disabled':''}>${[.75,1,1.25,1.5].map(x=>`<option value="${x}" ${x===(s.exam?1:speed)?'selected':''}>${x}×</option>`).join('')}</select></label>${s.exam?`<span class="small muted">${played}/2 lượt</span>`:''}</div>`}h+=`<div class="question" lang="zh-Hant">${E(q.prompt)}</div>`;if(q.typed){h+=`<div class="row"><input id="typed" type="text" class="search" placeholder="Nhập chữ Trung phồn thể" value="${A(a??'')}" ${graded?'disabled':''}>${btn(s.exam?'Lưu câu trả lời':'Kiểm tra','typeanswer',graded?'disabled':'','primary')}</div>`}else{h+=`<div class="opts">${q.options.map((o,i)=>btn(`<span class="letter">${String.fromCharCode(65+i)}</span><span>${E(o)}</span>`,'answer',`data-n="${i}" ${graded?'disabled':''}`,'opt '+(graded?(i===q.answer?'correct':a===i?'wrong':''):a===i?' function highlight(txt,ids){const words=(ids||[]).map(id=>wordIndex.get(id)?.zh).filter(Boolean).sort((a,b)=>b.length-a.length);if(!words.length)return E(txt);let re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');return txt.split(re).map((part,i)=>i%2?`<mark class="highlight">${E(part)}</mark>`:E(part)).join('')}

function submit(timed=false){let s=session;if(!s||s.done)return;if(!s.exam&&Object.keys(s.answers).length<s.qs.length&&!timed&&!confirm('Một số câu chưa trả lời. Nộp bài?'))return;if(s.exam&&!timed&&!confirm('Nộp bài và xem kết quả?'))return;for(let i=0;i<s.qs.length;i++)if(!s.graded[i]){logAnswer(s.qs[i],s.answers[i]);s.graded[i]=true}let right=s.qs.filter((q,i)=>isRight(q,s.answers[i])).length;s.done=true;s.right=right;if(s.exam){S.stats.exams.push({title:s.title,right,total:s.qs.length,time:Date.now()});save()}stopSpeech();render();scrollQuiz();if(timed)toast('Hết giờ: đã tự động nộp bài.')}
function resultsView(){let s=session,n=s.qs.length;const psg=[...new Map(s.qs.filter(q=>q.passage).map(q=>[q.passage.id,q.passage])).values()];return `<div class="card quiz stack"><span class="tag">測驗結果 · KẾT QUẢ</span><h1>${s.right}/${n} · ${Math.round(s.right/n*100)}%</h1>${progress(Math.round(s.right/n*100))}<p class="muted">Đã lưu kết quả và các câu sai. Điểm luyện tập, không phải điểm TOCFL chính thức.</p><div class="row">${btn('Xem sổ lỗi sai','nav','data-id="wrong"','primary')}${btn('Luyện lại','retry')}${btn('Trở về','quit')}</div><h2>解析 · Giải thích từng câu</h2>${s.qs.map((q,i)=>`<div class="review-item"><b>${isRight(q,s.answers[i])?'✓':'✕'} ${i+1}. ${E(q.prompt)}</b><p class="small">Bạn chọn: ${E(q.typed?(s.answers[i]??'Chưa trả lời'):(q.options[s.answers[i]]??'Chưa trả lời'))}</p><p><b>Đáp án: ${E(q.typed||q.options[q.answer])}</b></p><p class="muted">${E(q.explanation)}</p></div>`).join('')}${psg.length?'<h2>原文與翻譯 · Transcript và bản dịch</h2>':''}${psg.map(p=>`<details><summary>${E(p.title)} · Xem nội dung và bản dịch</summary><div class="passage">${E(p.body)}</div><p>${E(p.vi)}</p>${p.mode==='L'?btn('🔊 Nghe lại','resultaudio',`data-id="${A(p.id)}"`):''}</details>`).join('')}</div>`}
function updateClock(){const el=$('#timer');if(!el||!session?.exam||session.done)return;let sec=Math.max(0,Math.ceil((session.end-Date.now())/1000));el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec===0)submit(true)}
function wrongView(){if(session)return quizView();let list=Object.values(S.wrong).sort((a,b)=>b.last-a.last);return heading('錯題本 · Sổ tay lỗi sai',list.length+' câu cần ôn. Câu sai được gỡ sau hai lần trả lời đúng liên tiếp.')+`<div class="row">${btn('Ôn tất cả câu sai','reviewwrong',list.length?'':'disabled','primary')}${btn('Ôn từ liên quan','reviewwords',list.length?'':'disabled')}</div><div class="card section">${list.map(x=>`<div class="review-item"><div class="row between"><span class="tag">Sai ${x.count} lần · đúng liên tiếp ${x.streak||0}/2</span>${btn('Luyện câu này','singlewrong',`data-id="${A(x.q.id)}"`,'subtle')}</div><h3>${E(x.q.prompt)}</h3><p class="muted small">${E((x.q.words||[]).map(id=>wordIndex.get(id)?.zh).filter(Boolean).join(' · '))}</p></div>`).join('')||'<div class="empty">Chưa có câu sai. Hãy bắt đầu học!</div>'}</div>`}

function settings(){return heading('設定 · Quản lý dữ liệu','Không cần đăng nhập, không gửi dữ liệu lên máy chủ.')+`<div class="grid"><div class="card stack"><h2>進度備份 · Sao lưu tiến độ</h2><p>Bản JSON gồm tiến độ, lịch sử, câu sai và học liệu bạn đã nhập. Dùng để chuyển thiết bị hoặc khôi phục khi xóa dữ liệu trình duyệt.</p>${btn('Tải bản sao lưu JSON','backup','','primary')}${btn('Khôi phục bản sao lưu','import','data-mode="backup"')}<p class="small muted">Khôi phục sẽ thay thế dữ liệu hiện tại.</p></div><div class="card stack"><h2>匯入教材 · Nhập học liệu</h2><p>Thêm từ vựng hoặc câu trắc nghiệm vào 25 chủ đề hiện có. CSV UTF-8 hoặc JSON.</p>${btn('Nhập từ vựng CSV / JSON','import','data-mode="words"','primary')}${btn('Nhập câu hỏi CSV / JSON','import','data-mode="questions"')}${btn('Tải CSV mẫu từ vựng','sample','data-mode="words"')}${btn('Tải CSV mẫu câu hỏi','sample','data-mode="questions"')}<p class="small muted">Câu hỏi có 4 lựa chọn, answer = 1–4 trong CSV hoặc JSON nhập liệu. Cột words gồm các chữ Hán ngăn bằng dấu |.</p></div><div class="card stack"><h2>主題代碼 · Mã chủ đề</h2><p class="small muted">Điền topic bằng mã hoặc tên tiếng Trung.</p><details><summary>Xem toàn bộ 25 mã</summary>${T.map(t=>`<p class="small">${t.id} · ${E(t.zh)} · ${E(t.vi)}</p>`).join('')}</details>${btn('Xuất danh sách từ hiện có (CSV)','exportwords')}</div><div class="card stack"><h2>語音設定 · Âm thanh & hiển thị</h2><p id="voiceinfo" class="small muted">${E(voiceText())}</p>${btn('Thử phát âm tiếng Trung','testvoice')}${btn(S.dark?'Giao diện sáng':'Giao diện tối','theme')}${btn('Xóa toàn bộ tiến độ','reset','','danger')}<p class="small muted">Xóa tiến độ giữ lại học liệu đã nhập. Giọng đọc phụ thuộc thiết bị và có thể cần kết nối mạng của trình duyệt.</p></div></div><div class="card section"><h2>JSON mẫu</h2><pre>${E(JSON.stringify([{topic:'t01',zh:'平等',pinyin:'píngděng',vi:'bình đẳng',pos:'T/N',collocation:'人人平等',example:'我們應尊重人人平等的原則。',translation:'Chúng ta nên tôn trọng nguyên tắc bình đẳng.',near:'公平'}],null,2))}</pre><pre>${E(JSON.stringify([{topic:'t01',prompt:'「保障」 nghĩa là gì?',options:['Bảo đảm','Xua đuổi','Tuyên bố','Phân bổ'],answer:1,explanation:'保障 nghĩa là bảo đảm, bảo vệ.',words:['保障']}],null,2))}</pre></div>`}
const posLabels={N:'Danh từ',V:'Động từ',T:'Tính từ',P:'Phó từ'};
function voices(){return 'speechSynthesis' in window?window.speechSynthesis.getVoices():[]}
function getVoice(){let vs=voices();return vs.find(v=>/^zh[-_]TW$/i.test(v.lang))||vs.find(v=>/^zh[-_]Hant/i.test(v.lang))||vs.find(v=>/^zh[-_](CN|HK)$/i.test(v.lang)&&!/cantonese|粵語|廣東/i.test(v.name)&&(!/^zh[-_]HK$/i.test(v.lang)||/mandarin|普通話|國語/i.test(v.name)))||vs.find(v=>/^zh$/i.test(v.lang))}
function voiceText(){let v=getVoice();return v?'Giọng hiện có: '+v.name+' ('+v.lang+'). '+(/^zh[-_]TW$/i.test(v.lang)?'Giọng Đài Loan.':'Giọng thay thế, không nhất thiết là giọng Đài Loan.'):'Chưa tìm thấy giọng Quan thoại. Hãy cài giọng Chinese (Taiwan) trong hệ điều hành/trình duyệt.'}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speak(txt,rate=1){if(!txt||!('speechSynthesis' in window)){toast('Thiết bị không hỗ trợ đọc tiếng Trung.');return false}let v=getVoice();if(!v){toast('Chưa có giọng Quan thoại. Xem hướng dẫn ở mục Dữ liệu.');return false}stopSpeech();let u=new SpeechSynthesisUtterance(txt);u.lang=v.lang;u.voice=v;u.rate=rate;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('Không phát được giọng đọc: '+e.error)};window.speechSynthesis.speak(u);return true}
function download(name,txt,type='application/json'){let blob=new Blob([txt],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const wc=['topic','zh','pinyin','vi','pos','collocation','example','translation','near'];const qc=['topic','prompt','option1','option2','option3','option4','answer','explanation','words'];
function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function parseCSV(text){text=text.replace(/^\ufeff/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=c}else if(c==='"'&&cell==='')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV có dấu ngoặc kép chưa đóng.');if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}const h=rows.shift()?.map(x=>x.trim());if(!h)throw Error('CSV rỗng.');return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
const str=v=>typeof v==='string'?v.trim():'';
function validWord(r){let t=T.find(t=>t.id===r.topic||t.zh===r.topic||t.vi===r.topic);if(!t)throw Error('Mã chủ đề không hợp lệ: '+r.topic);let w=Object.fromEntries(wc.slice(1).map(k=>[k,str(r[k])]));if(wc.slice(1,-1).some(k=>!w[k]))throw Error('Thiếu trường từ vựng bắt buộc: '+(w.zh||'?'));if(!w.example.includes(w.zh))throw Error('Ví dụ phải chứa từ: '+w.zh);if(t.words.some(x=>x.zh===w.zh))throw Error('Trùng từ trong chủ đề: '+w.zh);return {...w,topic:t.id,id:uid()}}
function validQuestion(r){let t=T.find(t=>t.id===r.topic||t.zh===r.topic||t.vi===r.topic);if(!t)throw Error('Mã chủ đề không hợp lệ: '+r.topic);let opts=(Array.isArray(r.options)?r.options:[r.option1,r.option2,r.option3,r.option4]).map(str),a=Number(r.answer)-1,prompt=str(r.prompt),explanation=str(r.explanation);if(opts.length!==4||opts.some(x=>!x)||new Set(opts).size!==4||!Number.isInteger(a)||a<0||a>3||!prompt||!explanation)throw Error('Câu hỏi thiếu dữ liệu, đáp án sai hoặc lựa chọn trùng.');let ws=Array.isArray(r.words)?r.words:str(r.words).split('|').filter(Boolean);let ids=ws.map(w=>{let x=t.words.find(x=>x.zh===w||x.id===w);if(!x)throw Error('Không tìm thấy từ liên kết: '+w);return x.id});return {id:uid(),topic:t.id,prompt,options:opts,answer:a,explanation,words:ids}}
let importMode='';
function verifyBackup(b){if(!b||b.version!==1||typeof b.progress!=='object'||!b.progress||Array.isArray(b.progress)||typeof b.wrong!=='object'||!b.wrong||!b.stats||!Array.isArray(b.stats.exams)||!Number.isFinite(b.stats.attempts)||!Number.isFinite(b.stats.correct)||!b.custom||!Array.isArray(b.custom.words)||!Array.isArray(b.custom.questions))throw Error('Không đúng cấu trúc bản sao lưu v1.');for(const w of b.custom.words)if(!w||!BASE.some(t=>t.id===w.topic)||typeof w.id!=='string'||wc.slice(1,-1).some(k=>typeof w[k]!=='string'))throw Error('Bản sao lưu chứa từ vựng không hợp lệ.');for(const q of b.custom.questions)if(!q||!BASE.some(t=>t.id===q.topic)||typeof q.id!=='string'||!Array.isArray(q.options)||!Array.isArray(q.words)||typeof q.prompt!=='string'||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length)throw Error('Bản sao lưu chứa câu hỏi không hợp lệ.');for(const p of Object.values(b.progress))if(!p||!Number.isFinite(p.stage)||!Number.isFinite(p.due)||!Number.isFinite(p.seen))throw Error('Tiến độ không hợp lệ.');for(const x of Object.values(b.wrong))if(!x?.q||typeof x.q.id!=='string'||typeof x.q.prompt!=='string'||(!x.q.typed&&!Array.isArray(x.q.options)))throw Error('Sổ lỗi sai không hợp lệ.');return b}
async function importFile(file){let text=await file.text();if(importMode==='backup'){let b=verifyBackup(JSON.parse(text));if(!confirm('Thay thế toàn bộ dữ liệu hiện tại bằng bản sao lưu?'))return;S=b;save();rebuild();flash=null;session=null;match=null;render();toast('Đã khôi phục bản sao lưu.');return}let rows=file.name.toLowerCase().endsWith('.csv')?parseCSV(text):JSON.parse(text);if(!Array.isArray(rows))throw Error('File JSON phải là mảng [].');let accepted=[],errors=[],seen=new Set();for(let [i,r] of rows.entries()){try{let x=importMode==='words'?validWord(r):validQuestion(r);let key=x.topic+'|'+(x.zh||x.prompt);if(seen.has(key))throw Error('Trùng dòng trong file');seen.add(key);accepted.push(x)}catch(e){errors.push('Dòng '+(i+1)+': '+e.message)}}if(errors.length&&!confirm('Có '+errors.length+' dòng lỗi. '+errors.slice(0,5).join('\n')+'\nNhập '+accepted.length+' dòng hợp lệ?'))return;if(!accepted.length){toast('Không có dòng hợp lệ.');return}S.custom[importMode].push(...accepted);save();rebuild();render();toast('Đã nhập '+accepted.length+' dòng; bỏ qua '+errors.length+' dòng lỗi.')}
function leave(){if((session&&!session.done||match&&match.solved.length<match.words.length)&&!confirm('Thoát bài đang làm? Kết quả đã chấm được giữ lại; bài thi chưa nộp sẽ bị hủy.'))return false;session=null;match=null;flash=null;stopSpeech();return true}
function navigate(id){if(!leave())return;page=id;search='';filter='all';if(id==='due')initFlash(dueWords(),'due');render();window.scrollTo(0,0)}
function act(el){if(el.disabled)return;let a=el.dataset.act,id=el.dataset.id,n=Number(el.dataset.n),w=wordIndex.get(el.dataset.word);switch(a){case 'nav':navigate(id);break;case 'topic':if(!leave())return;tid=id;page='topic';tab='words';search='';render();window.scrollTo(0,0);break;case 'tab':if(!leave())return;tab=id;search='';render();break;case 'theme':S.dark=!S.dark;save();render();break;case 'stop':stopSpeech();break;case 'speak':if(w)speak(w.zh);break;case 'mark':if(w){grade(w,0);render();toast('Đã thêm vào lịch ôn sau 5 phút.')}break;case 'flip':flash.flip=!flash.flip;render();break;case 'flashreset':initFlash(page==='due'?dueWords():topic().words,flash.mode,flash.reverse);render();break;case 'flashprev':flash.i=Math.max(0,flash.i-1);flash.flip=false;render();break;case 'flashnext':flash.i=Math.min(flash.ids.length,flash.i+1);flash.flip=false;render();break;case 'grade':{let v=wordIndex.get(flash.ids[flash.i]);if(v){grade(v,n);flash.done++;flash.i++;flash.flip=false;render()}break}case 'practice':startPractice(id);break;case 'custompractice':startSession(shuffle(topic().questions).map(q=>prepare(q)),'Câu hỏi đã nhập');break;case 'matchleft':match.picked=id;render();break;case 'matchright':if(!match.picked)return toast('Chọn từ bên trái trước.');{let v=wordIndex.get(match.picked);let q=qMake(topic(),v,'meaning');q.id=v.id+'-match';q.prompt='Nối từ: '+v.zh;if(id===match.picked){match.solved.push(id);logAnswer(q,0);match.picked=null}else{match.mistakes++;q.options=[v.vi,wordIndex.get(id).vi,...q.options.filter(x=>x!==v.vi&&x!==wordIndex.get(id).vi)].slice(0,4);logAnswer(q,1);toast('Chưa đúng, thử lại.')}render();break}case 'passage':{let p=topic().passages.find(p=>p.id===id);startSession(p.questions.map(q=>prepare(q,p)),p.title);break}case 'examstart':startExam();break;case 'answer':answer(n);break;case 'typeanswer':{let value=$('#typed')?.value.trim();if(!value)return toast('Nhập câu trả lời trước.');answer(value);break}case 'qnext':if(session.i<session.qs.length-1){stopSpeech();session.i++;render();scrollQuiz()}break;case 'qprev':if(session.i>0){stopSpeech();session.i--;render();scrollQuiz()}break;case 'qjump':stopSpeech();session.i=n;render();scrollQuiz();break;case 'flag':session.flags[session.i]=!session.flags[session.i];render();break;case 'submit':submit();break;case 'quit':if(leave())render();break;case 'qaudio':{let q=session.qs[session.i],key=q.passage?.id||q.id;if(session.exam&&(session.plays[key]||0)>=2)return;if(speak(q.audio,session.exam?1:speed)){session.plays[key]=(session.plays[key]||0)+1;if(session.exam)render()}break}case 'resultaudio':{let p=session.qs.find(q=>q.passage?.id===id)?.passage;if(p)speak(p.body,speed);break}case 'retry':{let s=session;startSession(s.qs.map(q=>prepare(q)),s.title,s.exam,s.exam?s.minutes:0);break}case 'reviewwrong':startSession(shuffle(Object.values(S.wrong).map(x=>prepare(x.q))),'Ôn câu sai');break;case 'singlewrong':startSession([prepare(S.wrong[id].q)],'Ôn câu sai');break;case 'reviewwords':{let ids=[...new Set(Object.values(S.wrong).flatMap(x=>x.q.words||[]))];let qs=ids.map(id=>{let t=T.find(t=>t.words.some(w=>w.id===id));return t?prepare(qMake(t,wordIndex.get(id),'cloze')):null}).filter(Boolean);startSession(qs,'Ôn từ liên quan');break}case 'backup':download('tocfl-b2-backup.json',JSON.stringify(S,null,2));break;case 'import':importMode=el.dataset.mode;$('#file').accept=importMode==='backup'?'.json':'.json,.csv';$('#file').value='';$('#file').click();break;case 'sample':if(el.dataset.mode==='words')download('tocfl-words-template.csv',csv([wc,['t01','平等','píngděng','bình đẳng','T/N','人人平等','我們應尊重人人平等的原則。','Chúng ta nên tôn trọng nguyên tắc bình đẳng.','公平']]),'text/csv;charset=utf-8');else download('tocfl-questions-template.csv',csv([qc,['t01','「保障」 nghĩa là gì?','Bảo đảm','Xua đuổi','Tuyên bố','Phân bổ',1,'保障 nghĩa là bảo đảm, bảo vệ.','保障']]),'text/csv;charset=utf-8');break;case 'exportwords':download('tocfl-vocabulary.csv',csv([wc,...T.flatMap(t=>t.words.map(w=>wc.map(k=>k==='topic'?t.id:w[k])))]),'text/csv;charset=utf-8');break;case 'testvoice':speak('您好，歡迎來到華語學堂。今天一起學習中文吧！');break;case 'reset':if(confirm('Xóa toàn bộ tiến độ, lịch thi và câu sai? Học liệu nhập thêm được giữ lại.')){let c=S.custom,d=S.dark;S=defaults();S.custom=c;S.dark=d;save();rebuild();render();toast('Đã xóa tiến độ.')}break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(el)act(el)});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flash[data-act]')){e.preventDefault();act(e.target)}if(e.key==='Enter'&&e.target.id==='typed'){e.preventDefault();act(document.querySelector('[data-act="typeanswer"]'))}});document.addEventListener('input',e=>{if(e.target.id==='topicsearch'){search=e.target.value;$('#topicgrid').innerHTML=filteredTopics()}if(e.target.id==='wordsearch'){search=e.target.value;$('#wordgrid').innerHTML=filteredWords(topic())}});document.addEventListener('change',e=>{let t=e.target;if(t.id==='topicfilter'){filter=t.value;$('#topicgrid').innerHTML=filteredTopics()}if(t.id==='flashmode'||t.id==='reverse'){let m=$('#flashmode').value,r=$('#reverse').checked;initFlash(page==='due'?dueWords():topic().words,m,r);render()}if(t.id==='speed')speed=Number(t.value);if(t.id==='file'&&t.files[0])importFile(t.files[0]).catch(e=>toast('Không nhập được: '+e.message))});if('speechSynthesis' in window)window.speechSynthesis.addEventListener('voiceschanged',()=>{let x=$('#voiceinfo');if(x)x.textContent=voiceText()});window.addEventListener('beforeunload',e=>{if(session&&!session.done&&session.exam){e.preventDefault();e.returnValue=''}});rebuild();render();clock=setInterval(updateClock,500);
</script></body></html>
